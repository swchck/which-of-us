<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Кто из нас?</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 40%, #5b2db0, #2f1566 60%, #1a0b3d);
        color: #fff;
        font-family: 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
        overflow: hidden;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 64px;
        color: #ffd23f;
        text-shadow: 0 5px 0 #1b1033, 4px 0 0 #1b1033, -4px 0 0 #1b1033, 0 -4px 0 #1b1033;
        transform: rotate(-3deg);
      }
      svg { animation: bounce 1.4s ease-in-out infinite; }
      p { margin: 0; font-size: 22px; color: #b7a6e6; }
      .fail { display: none; max-width: 520px; color: #fff; }
      body.failed .fail { display: block; }
      body.failed .wait { display: none; }

      /* ── Update banner ── */
      #update-banner {
        display: none;
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        background: #1b1033;
        border: 3px solid #ffd23f;
        border-radius: 18px;
        padding: 20px 28px;
        text-align: left;
        width: 480px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        z-index: 10;
      }
      #update-banner h3 {
        margin: 0 0 10px;
        font-size: 20px;
        color: #ffd23f;
      }
      #update-notes {
        max-height: 140px;
        overflow-y: auto;
        margin: 0 0 16px;
        font-size: 17px;
        color: #c9b8f0;
        line-height: 1.6;
        white-space: pre-wrap;
      }
      #update-banner .btns {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }
      #update-banner button {
        padding: 8px 22px;
        border-radius: 12px;
        border: 2px solid #ffd23f;
        font: inherit;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
      }
      .btn-install { background: #ffd23f; color: #1b1033; }
      .btn-skip { background: transparent; color: #b7a6e6; border-color: #b7a6e6; }

      /* ── «Что нового» overlay ── */
      #whats-new {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(18, 6, 42, 0.85);
        z-index: 20;
        align-items: center;
        justify-content: center;
      }
      #whats-new.show { display: flex; }
      .wn-card {
        background: #1b1033;
        border: 4px solid #ffd23f;
        border-radius: 24px;
        padding: 40px 48px;
        width: 560px;
        box-shadow: 0 12px 48px rgba(0,0,0,0.6);
        animation: pop 250ms both;
      }
      .wn-card h2 {
        margin: 0 0 6px;
        font-size: 36px;
        color: #ffd23f;
      }
      .wn-card .wn-ver {
        margin: 0 0 20px;
        font-size: 20px;
        color: #7b6aaa;
      }
      .wn-notes {
        font-size: 22px;
        color: #e8deff;
        line-height: 1.7;
        white-space: pre-wrap;
        margin: 0 0 28px;
      }
      .wn-card button {
        display: block;
        width: 100%;
        padding: 14px;
        border-radius: 16px;
        border: 3px solid #ffd23f;
        background: #ffd23f;
        color: #1b1033;
        font: inherit;
        font-size: 22px;
        font-weight: 900;
        cursor: pointer;
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
      @keyframes pop {
        from { opacity: 0; transform: scale(0.92); }
        to   { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <main data-tauri-drag-region>
      <h1>Кто из нас?</h1>
      <svg viewBox="-170 -170 340 340" width="200" height="200" aria-hidden="true">
        <ellipse cx="0" cy="10" rx="150" ry="138" fill="#e8a24a" stroke="#1b1033" stroke-width="10" />
        <path d="M-146 -10 Q-150 -128 0 -130 Q150 -128 146 -10 Q140 18 118 6 Q104 34 84 10 Q64 32 40 8 Q16 36 -10 8 Q-36 34 -58 8 Q-82 32 -100 6 Q-124 26 -146 -10 Z"
          fill="#ff7ac8" stroke="#1b1033" stroke-width="10" />
        <ellipse cx="0" cy="-62" rx="48" ry="26" fill="#2a1458" stroke="#1b1033" stroke-width="10" />
        <ellipse cx="-46" cy="22" rx="17" ry="20" fill="#1b1033" />
        <ellipse cx="46" cy="22" rx="17" ry="20" fill="#1b1033" />
        <path d="M-34 58 Q0 100 34 58" stroke="#1b1033" stroke-width="10" fill="none" stroke-linecap="round" />
      </svg>
      <p class="wait">Бублик готовит сцену…</p>
      <p class="fail">
        Не получилось запустить игровой сервер. Закройте другие копии игры и попробуйте снова. Если
        не поможет — перезагрузите компьютер.
      </p>
    </main>

    <div id="update-banner">
      <h3 id="update-heading">Доступно обновление</h3>
      <div id="update-notes"></div>
      <div class="btns">
        <button class="btn-skip" id="btn-skip">Позже</button>
        <button class="btn-install" id="btn-install">Установить</button>
      </div>
    </div>

    <div id="whats-new">
      <div class="wn-card">
        <h2>Что нового</h2>
        <p class="wn-ver" id="wn-ver"></p>
        <div class="wn-notes" id="wn-notes"></div>
        <button id="wn-ok">Отлично!</button>
      </div>
    </div>

    <script>
      window.showFailure = () => document.body.classList.add('failed');

      (async () => {
        const internals = window.__TAURI_INTERNALS__;
        if (!internals) return;

        // load changelog.json bundled alongside this page
        let changelog = {};
        try {
          const res = await fetch('./changelog.json');
          changelog = await res.json();
        } catch {}

        // get current version via Tauri command
        let version = '';
        try {
          version = await internals.invoke('app_version');
        } catch {}

        // «Что нового» after an update: fire when the version changes
        const LAST_KEY = 'kto_last_version';
        const lastSeen = localStorage.getItem(LAST_KEY);
        if (version && lastSeen && lastSeen !== version && changelog[version]) {
          // server may not be ready yet; show «Что нового» now,
          // the ok button will navigate when server is ready
          showWhatsNew(version, changelog[version]);
        }
        if (version) localStorage.setItem(LAST_KEY, version);

        // check for available update
        try {
          const update = await internals.invoke('plugin:updater|check', {});
          if (update) {
            const notes = (update.body || '').trim();
            document.getElementById('update-heading').textContent =
              `Доступно обновление ${update.version}`;
            document.getElementById('update-notes').textContent = notes || '';
            document.getElementById('update-notes').style.display = notes ? 'block' : 'none';
            document.getElementById('update-banner').style.display = 'block';
            document.getElementById('btn-install').onclick = async () => {
              document.getElementById('btn-install').textContent = 'Загрузка…';
              document.getElementById('btn-install').disabled = true;
              await internals.invoke('plugin:updater|download_and_install', { onEvent: null });
              await internals.invoke('plugin:process|restart', {});
            };
            document.getElementById('btn-skip').onclick = () => {
              document.getElementById('update-banner').style.display = 'none';
            };
          }
        } catch {}
      })();

      let serverReady = false;
      let whatsNewPending = false;

      function showWhatsNew(version, notes) {
        document.getElementById('wn-ver').textContent = `Версия ${version}`;
        document.getElementById('wn-notes').textContent = notes;
        document.getElementById('whats-new').classList.add('show');
        whatsNewPending = true;
        document.getElementById('wn-ok').onclick = () => {
          document.getElementById('whats-new').classList.remove('show');
          whatsNewPending = false;
          if (serverReady) navigateToGame();
        };
      }

      let gameUrl = null;
      function navigateToGame() {
        if (gameUrl) location.href = gameUrl;
      }

      // called by lib.rs via window.eval when server is ready
      window.__onServerReady = (url) => {
        gameUrl = url;
        serverReady = true;
        if (!whatsNewPending) navigateToGame();
      };
    </script>
  </body>
</html>
