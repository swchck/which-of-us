<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Кто из нас?</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 40%, #5b2db0, #2f1566 60%, #1a0b3d);
        color: #fff;
        font-family: 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
        overflow: hidden;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 64px;
        color: #ffd23f;
        text-shadow:
          0 5px 0 #1b1033,
          4px 0 0 #1b1033,
          -4px 0 0 #1b1033,
          0 -4px 0 #1b1033;
        transform: rotate(-3deg);
      }
      svg {
        animation: bounce 1.4s ease-in-out infinite;
      }
      p {
        margin: 0;
        font-size: 22px;
        color: #b7a6e6;
      }
      .fail {
        display: none;
        max-width: 520px;
        color: #fff;
      }
      body.failed .fail {
        display: block;
      }
      body.failed .wait {
        display: none;
      }
      #update-banner {
        display: none;
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        background: #1b1033;
        border: 3px solid #ffd23f;
        border-radius: 18px;
        padding: 16px 28px;
        text-align: center;
        min-width: 340px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        z-index: 10;
      }
      #update-banner p {
        margin: 0 0 14px;
        font-size: 18px;
        color: #ffd23f;
        font-weight: 700;
      }
      #update-banner .btns {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      #update-banner button {
        padding: 8px 22px;
        border-radius: 12px;
        border: 2px solid #ffd23f;
        font: inherit;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
      }
      #update-banner .btn-install {
        background: #ffd23f;
        color: #1b1033;
      }
      #update-banner .btn-skip {
        background: transparent;
        color: #b7a6e6;
        border-color: #b7a6e6;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }
    </style>
  </head>
  <body>
    <main data-tauri-drag-region>
      <h1>Кто из нас?</h1>
      <svg viewBox="-170 -170 340 340" width="200" height="200" aria-hidden="true">
        <ellipse cx="0" cy="10" rx="150" ry="138" fill="#e8a24a" stroke="#1b1033" stroke-width="10" />
        <path
          d="M-146 -10 Q-150 -128 0 -130 Q150 -128 146 -10 Q140 18 118 6 Q104 34 84 10 Q64 32 40 8 Q16 36 -10 8 Q-36 34 -58 8 Q-82 32 -100 6 Q-124 26 -146 -10 Z"
          fill="#ff7ac8"
          stroke="#1b1033"
          stroke-width="10"
        />
        <ellipse cx="0" cy="-62" rx="48" ry="26" fill="#2a1458" stroke="#1b1033" stroke-width="10" />
        <ellipse cx="-46" cy="22" rx="17" ry="20" fill="#1b1033" />
        <ellipse cx="46" cy="22" rx="17" ry="20" fill="#1b1033" />
        <path d="M-34 58 Q0 100 34 58" stroke="#1b1033" stroke-width="10" fill="none" stroke-linecap="round" />
      </svg>
      <p class="wait">Бублик готовит сцену…</p>
      <p class="fail">
        Не получилось запустить игровой сервер. Закройте другие копии игры и попробуйте снова. Если
        не поможет — перезагрузите компьютер.
      </p>
    </main>
    <div id="update-banner">
      <p id="update-msg">Доступно обновление</p>
      <div class="btns">
        <button class="btn-install" id="btn-install">Установить</button>
        <button class="btn-skip" id="btn-skip">Позже</button>
      </div>
    </div>
    <script>
      window.showFailure = () => document.body.classList.add('failed');

      (async () => {
        const internals = window.__TAURI_INTERNALS__;
        if (!internals) return;
        try {
          const update = await internals.invoke('plugin:updater|check', {});
          if (!update) return;
          const banner = document.getElementById('update-banner');
          document.getElementById('update-msg').textContent =
            `Доступно обновление ${update.version}`;
          banner.style.display = 'block';
          document.getElementById('btn-install').onclick = async () => {
            document.getElementById('btn-install').textContent = 'Загрузка…';
            document.getElementById('btn-install').disabled = true;
            await internals.invoke('plugin:updater|download_and_install', { onEvent: null });
            await internals.invoke('plugin:process|restart', {});
          };
          document.getElementById('btn-skip').onclick = () => {
            banner.style.display = 'none';
          };
        } catch {}
      })();
    </script>
  </body>
</html>
