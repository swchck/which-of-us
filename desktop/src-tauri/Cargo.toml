[package]
name = "kto-iz-nas"
version = "1.0.0"
description = "Party game for a TV and phones over local Wi-Fi"
edition = "2021"
rust-version = "1.80"

[lib]
name = "kto_iz_nas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
