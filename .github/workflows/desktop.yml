name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # the runtime is copied into the installer, so it must be a uv-managed Python, never the runner's own
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4

      # node --build-sea (used for the server sidecar) needs Node 25.5+; official builds have SEA enabled
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - uses: astral-sh/setup-uv@v7

      # the live voice for names and answers: its Python packages come from the lock file
      - run: uv sync --frozen --python 3.12
        working-directory: tts/vosk

      - uses: actions/cache@v4
        with:
          path: tts/models/vosk
          key: vosk-model-${{ runner.os }}-${{ hashFiles('tts/vosk/model.sha256') }}

      # checks the download against the host's MD5 and the committed per-file SHA-256 list
      - run: node scripts/fetch-vosk-model.mjs

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      - run: npm run check

      - run: npm run desktop:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # one live render through the runtime that went into the installer
      - run: npm run tts:smoke

      # the same two directories the full installer carries, as archives the light build fetches
      - run: npm run voice:archive

      # both builds write the same bundle paths, so the full one is put aside before the light one
      # runs; it is the installer for a computer that will never download anything
      - name: Set the full installer aside
        shell: bash
        run: |
          mkdir -p full
          find desktop/src-tauri/target/release/bundle -maxdepth 2 \( -name '*.dmg' -o -name '*.exe' \) -exec mv {} full/ \;
          ls -la full

      - run: npm run desktop:build:lite
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Tauri's osascript step to embed the DS_Store can fail on CI; inject a pre-built
      # DS_Store instead by converting UDZO→UDRW, copying the file, then UDRW→UDZO
      - if: runner.os == 'macOS'
        name: Inject DS_Store into DMG (background + icon layout)
        run: |
          DMG=$(find desktop/src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          echo "Patching: $DMG"
          hdiutil convert "$DMG" -format UDRW -o /tmp/rw.dmg
          hdiutil attach /tmp/rw.dmg -mountpoint /tmp/dmg-rw -noverify -noautoopen
          cp desktop/dmg-ds-store /tmp/dmg-rw/.DS_Store
          hdiutil detach /tmp/dmg-rw -quiet
          hdiutil convert /tmp/rw.dmg -format UDZO -o /tmp/final.dmg
          mv /tmp/final.dmg "$DMG"
          rm /tmp/rw.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: kto-iz-nas-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/dmg/*.tar.gz
            desktop/src-tauri/target/release/bundle/dmg/*.sig
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: full-${{ runner.os }}
          path: full/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ runner.os }}
          path: build/voice/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: kto-iz-nas-*
          path: installers
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: full-*
          path: full
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: voice-*
          path: voice
          merge-multiple: true

      # the site and README link releases/latest/download/<name>, so the names carry no version;
      # each artifact keeps its bundle/ subfolder (dmg/, nsis/), hence find rather than a top-level glob
      - run: |
          mkdir release
          find installers -name '*.dmg' -exec mv {} release/kto-iz-nas-macos-arm64.dmg \;
          find installers -name '*.exe' -exec mv {} release/kto-iz-nas-windows-x64-setup.exe \;
          find installers -name '*.tar.gz' -exec mv {} release/ \;
          find installers -name '*.sig' -exec mv {} release/ \;
          # the full installers carry the voice inside, for a computer that cannot download it
          find full -name '*.dmg' -exec mv {} release/kto-iz-nas-macos-arm64-full.dmg \;
          find full -name '*.exe' -exec mv {} release/kto-iz-nas-windows-x64-full-setup.exe \;
          mv voice/* release/
          ls -la release
          test -f release/kto-iz-nas-macos-arm64.dmg && test -f release/kto-iz-nas-windows-x64-setup.exe
          test -f release/voice-macos.json && test -f release/voice-windows.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: |
          node scripts/updater-manifest.mjs "$GITHUB_REF_NAME" release/ > release/latest.json || true
          [ -s release/latest.json ] || rm -f release/latest.json
        name: Generate updater manifest (skipped when no .sig files)

      # published at once: a draft is invisible to releases/latest/download, so the download links would 404
      - run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      # the tap downloads the images it was just told about to checksum them, so
      # this has to come after the release is public
      - name: Point the Homebrew casks at this version
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          # the repository's own token cannot reach another repository, so a
          # checkout without the secret releases fine and leaves the tap alone
          [ -n "$GH_TOKEN" ] || { echo "no TAP_TOKEN set, leaving the tap alone"; exit 0; }
          # a v1.0.0-rc1 is not what `brew install` should hand people
          case "$GITHUB_REF_NAME" in *-*) echo "prerelease, leaving the tap alone"; exit 0 ;; esac
          gh api repos/swchck/homebrew-tap/dispatches \
            -f event_type=cask \
            -f 'client_payload[casks]=which-of-us,which-of-us-full' \
            -f "client_payload[version]=${GITHUB_REF_NAME#v}"
