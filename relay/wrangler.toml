name = "kto-relay"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[build]
command = "worker-build --release"

[[durable_objects.bindings]]
name = "TUNNEL"
class_name = "Tunnel"

# the free plan only has SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Tunnel"]

# per phone address: a party of twelve scanning the QR fits, guessing host codes does not
[[ratelimits]]
name = "LANDING"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[observability]
enabled = true
