[package]
name = "kto-relay"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
